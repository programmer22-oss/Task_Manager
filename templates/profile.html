{% extends "base.html" %}
{% block content %}

<!-- HEADER TOP GAP -->
<div style="margin-top: 20px;"></div>

<div class="profile-container">

  <!-- 1) Profile Card -->
  <div class="profile-card">
    <h2>Your Profile</h2>

    <p><strong>Username:</strong> {{ current_user.username }}</p>

    {% if current_user.created_at %}
    <p><strong>Joined:</strong> {{ current_user.created_at.strftime('%d %b %Y') }}</p>
    {% endif %}
  </div>


  <!-- 2) Profile Photo Card -->
  <div class="profile-card">
    <h3>Profile Photo</h3>

    <div class="profile-photo-box">
      <img src="/static/profile_pics/{{ current_user.profile_pic }}"
           class="profile-photo-preview">
    </div>

    <form method="POST" action="/profile/update-photo" enctype="multipart/form-data">
      <input type="file" name="profile_pic" accept="image/*" required>
      <button type="submit">Update Photo</button>
    </form>
  </div>


  <!-- 3) Update Username Card -->
  <div class="profile-card">
    <h3>Update Username</h3>

    <form method="POST" action="/profile/update-username">
      <input type="text" name="new_username" placeholder="New username" required>
      <button type="submit">Update Username</button>
    </form>
  </div>


  <!-- 4) Change Password Card -->
  <div class="profile-card">
    <h3>Change Password</h3>

    <form method="POST" action="/profile/update-password">
      <input type="password" name="old_password" placeholder="Old password" required>
      <input type="password" name="new_password" placeholder="New password" required>
      <button type="submit">Change Password</button>
    </form>
  </div>

</div>

{% endblock %}
